<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Co-parenting</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }
    .app-card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      width: 100%;
      max-width: 320px;
    }
    h1 {
      color: #2c3e50;
      font-size: 24px;
      margin-bottom: 24px;
    }
    .exit-btn {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
    }
    .exit-btn:active {
      background-color: #c0392b;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <h1>Co-parenting</h1>
    <button class="exit-btn" onclick="exitApp()">Exit</button>
  </div>

  <script>
    function exitApp() {
      // Attempts to close the window or redirects back to browser home page
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.close();
        // Fallback for mobile browsers that block auto-closing:
        alert("To exit, swipe up or tap your phone's Home button.");
      }
    }
  </script>

</body>
</html>
